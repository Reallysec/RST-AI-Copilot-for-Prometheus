name: Bug report
description: Report a problem with RST AI Copilot for Prometheus
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug.

        **Before you submit:** search the [existing issues](https://github.com/reallysec/RST-AI-Copilot-for-Prometheus/issues) — duplicates are common.

        **Reporting a security vulnerability?** Do not open an issue. [Follow the security policy](https://github.com/reallysec/RST-AI-Copilot-for-Prometheus/security/policy) instead.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the problem. Screenshots or a screen recording help.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: How do we reproduce it?
      value: |
        1.
        2.
        3.
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: The `GATEWAY_IMAGE_TAG` value in `.env`, or the tag shown by `docker compose images gateway`.
      placeholder: "1.2.20"
    validations:
      required: true

  - type: dropdown
    id: edition
    attributes:
      label: Edition
      options:
        - Community
        - Professional
        - Enterprise
        - Trial
    validations:
      required: true

  - type: dropdown
    id: deployment
    attributes:
      label: Deployment method
      options:
        - Delivery bundle (deploy.sh)
        - install.sh
        - Other
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Versions of the components involved.
      value: |
        Prometheus / Alertmanager / Grafana:
        LLM provider and model:
        Host OS and Docker version:
        Browser:
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: |
        Gateway logs: `docker compose logs gateway`. This is rendered as code, so no backticks are needed.
        **Remove credentials, license keys, API keys, and personal data before pasting.**
      render: shell

  - type: checkboxes
    id: terms
    attributes:
      label: Code of Conduct
      options:
        - label: I agree to follow this project's [Code of Conduct](https://github.com/reallysec/RST-AI-Copilot-for-Prometheus/blob/main/CODE_OF_CONDUCT.md).
          required: true
